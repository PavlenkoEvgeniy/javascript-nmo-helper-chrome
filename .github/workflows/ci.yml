name: CI

on:
  push:
    branches: [master, refactor/tests-and-ci]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Version check
        run: npm run check:version
      - name: Build and package
        run: npm run package
      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: nmo-helper-extension
          path: nmo-helper-*.zip
          if-no-files-found: error
          retention-days: 14
